url: https://marce10.github.io/dynaSpec
template:
  bootstrap: 5

reference:
- title: Create and save dynamic spectrograms
  desc: Start a dynamic spectrogram of a sound (or of a video) or a comparison of sounds, add layers with `+`, and save it as a web page, video or image.
  contents:
  - dynaspec
  - ds_compare
  - save_dynaspec
  - "+.dynaspec"
- title: Panels
  desc: The parts of the figure, added as layers (only the panels added are shown).
  contents:
  - ds_spectrogram
  - ds_oscillogram
  - ds_envelope
  - ds_spectrum
  - ds_overview
  - ds_video
- title: Filter the sound
  desc: Changes the sound itself (what is shown and heard).
  contents:
  - ds_filter
- title: Highlight and label the sound
  contents:
  - ds_annotations
  - ds_captions
- title: Styles
  desc: How the sound is shown as it plays (static, scrolling or paged spectrograms).
  contents:
  - styles
- title: Player
  desc: Playback controls of web pages.
  contents:
  - ds_player
- title: Themes
  desc: The look of axes, text, colors and player controls, preset themes, and themes for all spectrograms of a session.
  contents:
  - ds_theme
  - ds_set_theme
- title: Example sounds
  contents:
  - scythebill
  - antshrike
  - barn_swallow
- title: Package and defunct functions
  contents:
  - dynaSpec-package
  - dynaSpec-defunct
